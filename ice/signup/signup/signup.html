<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
        }

        body {
            background: rgb(120, 96, 64);
        }

        * {
    box-sizing: border-box;
    margin: 0;
}

body {
    min-height: 100vh;
    padding: 1rem;
    background: rgb(120, 96, 64);
    font-family: Georgia, "Times New Roman", serif;
}

#formContainer {
    position: relative;
    width: 500px;
    max-width: 100%;
    margin: 0 auto;
    overflow: hidden;
    border: 12px solid #123d8f;
    border-radius: 38px;
    background-color: white;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
}

#formContainer::before {
    content: "";
    display: block;
    height: 200px;
    background-image: url("images/jesus_feeds_5000.jpeg");
    background-position: top;
    background-size: cover;
    background-repeat: no-repeat;
}

#formContainer h3 {
    position: absolute;
    top: 85px;
    left: 0;
    z-index: 2;
    width: 100%;
    padding: 0;
    background: transparent;
    color: white;
    font-size: 0;
    text-align: center;
    text-shadow: 3px 3px 3px black;
}

#formContainer h3::before {
    content: "Daily Feed";
    display: block;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 2.8rem;
    line-height: 1;
}

#formContainer h3::after {
    content: "Scripture a Day";
    display: block;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 2rem;
    line-height: 1.2;
}


#closeBtn {
    position: absolute;
    top: 12px;
    left: 18px;
    z-index: 2;
    width: 32px;
    height: 30px;
    border: 1px solid #999;
    background-color: white;
    color: #111;
    font-size: 1.2rem;
    cursor: pointer;
}

#myForm {
    padding: 0 1.5rem 1.5rem;
    background-color: white;
    color: #111;
    font-size: 1.1rem;
}

#myForm > label[for] {
    display: inline-block;
    width: 48%;
    margin: 0.7rem 0;
    font-weight: bold;
}

#myForm > input[type="text"],
#myForm > input[type="password"],
#myForm > input[type="email"] {
    width: 48%;
    height: 26px;
    margin: 0.7rem 0;
    border: 1px solid #888;
}


#myForm > div {
    display: inline-block;
    width: 48%;
    margin: 0.7rem 0;
}

#myForm > div label {
    margin-right: 0.25rem;
}


#myForm section {
    margin: 1rem 0;
    text-align: center;
}

#myForm section label {
    margin-left: 0.25rem;
}

#myForm section:last-child {
    margin-top: 1.5rem;
}

#myForm button[type="submit"] {
    padding: 0.3rem 0.7rem;
    font-size: 1rem;
    cursor: pointer;
}

#scriptureCards {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    background-color: white;
}

#scriptureCards img {
    display: block;
    width: 100%;
    height: 120px;
    object-fit: cover;
}

@media (max-width: 550px) {
    #formContainer {
        border-width: 8px;
        border-radius: 25px;
    }

    #myForm > label[for],
    #myForm > input[type="text"],
    #myForm > input[type="password"],
    #myForm > input[type="email"],
    #myForm > div {
        display: block;
        width: 100%;
    }

    #myForm > input[type="text"],
    #myForm > input[type="password"],
    #myForm > input[type="email"] {
        margin-top: 0;
    }
}
    </style>
</head>

<body>
    <div id="formContainer">
        <h3>Sign Up for Daily Scripture Feed</h3>
        <form id="myForm">
            <button type="button" id="closeBtn">X</button>
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section>
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section>
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section>
                <button type="submit">Submit</button>
            </section>
        </form>

        <div id="scriptureCards">
    <img src="images/old_testament.webp" alt="Old Testament">
    <img src="images/new_testament.webp" alt="New Testament">
    <img src="images/book_of_mormon.webp" alt="Book of Mormon">
    <img src="images/doctrine_and_covenants.webp" alt="Doctrine and Covenants">
    <img src="images/pearl_of_great_price.webp" alt="Pearl of Great Price">
        </div>
    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
