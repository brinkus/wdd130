<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
        body{
            background-color: #E8ECDE ;
            padding-top: 20px;
            display: flex;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
        }
        div{
            text-align: center;
            background-image: url(images/christus.webp);
            background-size: cover;
            background-position: center;
            padding: 20px;
            width: 500px;
            border-radius: 30px;
            border: 4px solid black;

        }
        img{
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: 6px solid white;
            margin: 10px;
            object-fit: cover;
        }
        .presoaks{
            width: 125px;
            height: 125px;
            border-radius: 50%;
            border: 6px solid white;
            margin: 10px;
            object-fit: cover;
        }
        .eyring{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 6px solid white;
            margin: 10px;
            object-fit: cover;
        }

        
        h1, h2{
            color: white;
        }
    </style>
</head>
<body>
    <div>
        <h1>First Presidency</h1>


        <img class ="eyring" src="images/eyring.webp  " alt="Picture of Eyering">
        <img class ="presoaks" src="images/oaks.webp " alt="Picture of Eyering">
        <img class ="eyring" src="images/christofferson.webp  " alt="Picture of Eyering">

        <img class ="oaks" src="images/stevenson.webp  " alt="Picture of Eyering">
        <img class ="oaks" src="images/renlund.webp  " alt="Picture of Eyering">
        <img class ="oaks" src="images/gong.webp  " alt="Picture of Eyering">
        <img class ="oaks" src="images/soares.webp  " alt="Picture of Eyering">
        <img class ="oaks" src="images/kearon.webp  " alt="Picture of Eyering">
        <img class ="oaks" src="images/causse.webp  " alt="Picture of Eyering">
